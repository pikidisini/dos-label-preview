[package]
name = "dos_label_preview"
version = "3.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
resvg = "0.44"
regex = "1"
once_cell = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
qrcode = "0.14"
